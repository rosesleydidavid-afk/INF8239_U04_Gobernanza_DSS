priority_harm: "Que un caso urgente no sea detectado (falso negativo) y se atienda tarde. Por eso importa más el recall que la exactitud."
primary_metric: "Recall por grupo, junto con la brecha de recall y la de falsos positivos entre G1 y G2."
tolerance: "Recall global mínimo de 0.68 y brechas entre grupos de máximo 0.16 en recall y en falsos positivos (los límites de governance.yml)."
evidence: "Modelo logístico: recall global 0.717, G1 0.653 y G2 0.791 (brecha 0.138); falsos positivos G1 0.250 y G2 0.375 (brecha 0.125). Árbol: brecha de recall 0.181 y de falsos positivos 0.168, ambas fuera de la tolerancia. Informes en reports/lab12/."
limitation: "La prueba tiene 160 casos y solo 16 negativos en G2, por lo que los intervalos de confianza de G1 y G2 se solapan y la brecha puede ser azar. El recall de G1 (0.653) queda bajo el mínimo de 0.68 aunque el global lo cumple. Algunos grupos interseccionales tienen muy pocos casos (G2 de 45 a 59 años tiene 8) y no se interpretan. Los datos son sintéticos."
recommendation: "REVIEW. Usar el modelo logístico y no el árbol, solo para ordenar la revisión con una persona decidiendo, y reunir más casos de G2 y de G1 antes de cualquier uso real."
